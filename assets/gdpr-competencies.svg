ans-serif" font-weight="700" fill="#152E41">Normativa italiana</text><text x="80" y="1169" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#647889">Aree tematiche, non fasi obbligatorie: ogni skill è utilizzabile autonomamente. Nessuna certificazione automatica.</text><text x="1518" y="1169" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#EB792F">AIG · GDPR</text></svg>